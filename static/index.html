<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>家里的柜子 · 家庭储物管家</title>
<style>
:root{
  --bg:#F5F1E8;
  --bg2:#EFE9DC;
  --surface:#FFFDF9;
  --ink:#2E2A26;
  --muted:#8C8378;
  --line:#E7DFD1;
  --sage:#5E8B7A;
  --sage-soft:#E6EFEA;
  --clay:#C9793F;
  --clay-soft:#FAEBDF;
  --wood-1:#EFDFC5;
  --wood-2:#E2CDA9;
  --wood-3:#D3B98F;
  --brass:#C4A05A;
  --radius:20px;
  --shadow-sm:0 1px 2px rgba(70,54,34,.05), 0 4px 14px rgba(70,54,34,.05);
  --shadow-md:0 6px 24px rgba(70,54,34,.10), 0 2px 6px rgba(70,54,34,.06);
  --shadow-lg:0 24px 60px rgba(50,38,22,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -8%, #FFFDF7 0%, rgba(255,253,247,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #EFE7D8 0%, rgba(239,231,216,0) 55%),
    var(--bg);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 90px}

/* ---------- 顶栏 ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  background:rgba(245,241,232,.82);
  border-bottom:1px solid rgba(231,223,209,.7);
}
.top-in{max-width:1120px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(160deg,#7FA593,#5E8B7A);
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(94,139,122,.28);
}
.brand-mark svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.top-spacer{flex:1}
.top-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  font-size:13px;background:var(--surface);border:1px solid var(--line);color:#6E6250;
  box-shadow:var(--shadow-sm);transition:.18s;white-space:nowrap;
}
.top-btn:active{transform:scale(.97)}
.top-btn.solid{background:linear-gradient(160deg,#6F9A88,#527E6D);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(94,139,122,.26)}
.who-dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.who-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);box-shadow:var(--shadow-sm)}
.who-chip b{color:var(--ink);font-weight:600}
@media (max-width:600px){
  .brand p{display:none}
  .top-btn .t{display:none}
  .top-btn{padding:9px 11px}
  .who-chip span.t{display:none}
}

/* ---------- 概览 ---------- */
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;box-shadow:var(--shadow-sm)}
.stat span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.stat b{display:block;font-size:22px;font-weight:650;margin-top:3px;letter-spacing:.3px}
.stat b i{font-size:12px;font-style:normal;color:var(--muted);font-weight:500;margin-left:3px}

/* ---------- 搜索 ---------- */
.searchbar{margin:16px 0 6px;position:relative}
.searchbar input{
  width:100%;padding:14px 16px 14px 44px;border-radius:16px;font-size:14.5px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  outline:none;transition:.2s;
}
.searchbar input:focus{border-color:#C9D9D0;box-shadow:0 0 0 4px rgba(94,139,122,.10)}
.searchbar .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.42}
.searchbar .ico svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;display:none;place-items:center;
  background:var(--bg2);color:var(--muted);font-size:14px}
.search-clear.on{display:grid}

/* ---------- 房间 ---------- */
.room{margin-top:26px}
.room-head{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.room-head h2{margin:0;font-size:16.5px;font-weight:650;letter-spacing:.3px}
.room-head .meta{font-size:12px;color:var(--muted)}
.room-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.room-add{font-size:12px;color:#5F7F71;background:var(--sage-soft);border:1px solid #D3E4DA;
  border-radius:999px;padding:5px 10px;white-space:nowrap}
.room-add:active{transform:scale(.96)}

.cabs{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:900px){.cabs{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:560px){.cabs{grid-template-columns:repeat(2,1fr);gap:11px}}

/* ---------- 柜子卡片：半透明玻璃门 ---------- */
.cab{
  position:relative;border-radius:18px;padding:0;text-align:left;
  background:linear-gradient(180deg,#FBF7EF,#F6F0E3);
  border:1px solid #E8DECB;box-shadow:var(--shadow-sm);
  overflow:hidden;transition:transform .18s ease, box-shadow .22s ease, border-color .2s;
}
.cab:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#DFD2BA}
.cab:active{transform:scale(.985)}
.cab-head{display:flex;align-items:center;gap:6px;padding:10px 11px 0}
.cab-code{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#7A6A50;
  background:#F1E6D2;border:1px solid #E4D6BC;border-radius:7px;padding:2px 7px}
.cab-name{font-size:11px;color:#9A8E7C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-count{margin-left:auto;font-size:11px;color:#8A7E6B;background:rgba(255,255,255,.72);
  border-radius:999px;padding:2px 7px;border:1px solid #EADFCC}
.cab-count.hot{background:var(--sage-soft);border-color:#CFE0D7;color:#3F6B5A;font-weight:600}

.cab-body{position:relative;height:118px;margin:9px 11px 0;perspective:600px}
.cab-frame{
  position:absolute;inset:0;border-radius:9px;overflow:hidden;
  background:linear-gradient(160deg,var(--wood-1),var(--wood-2) 55%,var(--wood-3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 8px rgba(120,92,55,.18);
}
.cab-frame::after{
  content:"";position:absolute;inset:0;opacity:.24;
  background:repeating-linear-gradient(90deg,rgba(150,120,76,.20) 0 1px,transparent 1px 7px);
}
.cab-inside{
  position:absolute;inset:6px;border-radius:6px;background:#75634F;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.30);
  display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:5px;
  overflow:hidden;z-index:1;
}
.ins-line{
  height:17px;border-radius:4px;display:flex;align-items:center;gap:4px;padding:0 5px;
  font-size:9.5px;color:#332B22;white-space:nowrap;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.12);
}
.ins-line b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ins-line em{font-style:normal;opacity:.62;font-size:8.5px;margin-left:auto;padding-left:3px}
.ins-more{font-size:8.5px;color:rgba(255,255,255,.62);text-align:right;padding-right:2px}
.ins-empty{font-size:9.5px;color:rgba(255,246,230,.66);text-align:center;margin:auto}

/* 半透明柜门：透过门能看清里面的东西 */
.cab-door{
  position:absolute;top:0;bottom:0;width:50%;z-index:2;
  background:linear-gradient(155deg,rgba(255,253,247,.30),rgba(235,224,203,.18) 60%,rgba(214,197,168,.24));
  border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 0 10px rgba(255,255,255,.22), 0 1px 3px rgba(120,92,55,.10);
  backdrop-filter:blur(.5px) saturate(108%);
  -webkit-backdrop-filter:blur(.5px) saturate(108%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1), background .3s;
  overflow:hidden;
}
.cab-door::before{ /* 玻璃斜向高光 */
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 52%,rgba(255,255,255,.12) 100%);
}
.cab-door::after{ /* 门框 */
  content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.4);border-radius:3px;
}
.cab-door.left{left:0;transform-origin:left center;border-radius:9px 2px 2px 9px}
.cab-door.right{right:0;transform-origin:right center;border-radius:2px 9px 9px 2px}
.cab:hover .cab-door.left{transform:rotateY(-18deg)}
.cab:hover .cab-door.right{transform:rotateY(18deg)}
.handle{position:absolute;top:50%;width:4px;height:22px;border-radius:3px;
  background:linear-gradient(180deg,#E4C982,#C4A05A);
  box-shadow:0 1px 2px rgba(120,90,40,.35);transform:translateY(-50%);z-index:3}
.cab-door.left .handle{right:5px}
.cab-door.right .handle{left:5px}

.cab-foot{padding:9px 11px 11px;font-size:11.5px;color:#8A7E6B;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-foot b{color:#5C4E3B;font-weight:650}
.cab-foot .empty{color:#B4A794}

/* ---------- 搜索结果 ---------- */
.results{margin-top:18px;display:none}
.results.on{display:block}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:11px;width:100%;text-align:left}
.res-card:active{transform:scale(.99)}
.res-loc{font-size:11px;font-weight:700;color:#3F6B5A;background:var(--sage-soft);
  border-radius:7px;padding:3px 7px;flex:0 0 auto;letter-spacing:.4px}
.res-main{min-width:0;flex:1}
.res-main b{font-size:14px;font-weight:600}
.res-main small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-qty{font-size:12px;color:var(--muted);flex:0 0 auto}

/* ---------- 最近动态 ---------- */
.activity{margin-top:30px}
.activity-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.activity-head h3{margin:0;font-size:14px;font-weight:600;color:#6B6053}
.activity-head .dot{width:6px;height:6px;border-radius:50%;background:#CFC4B1}
.logs{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.log-row{display:flex;gap:10px;padding:11px 14px;font-size:12.5px;color:#5F5548;
  border-bottom:1px solid #F3EDE1}
.log-row:last-child{border-bottom:none}
.log-row .who{font-weight:600;color:#3E3830;flex:0 0 auto}
.log-row .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-row .at{color:#B4A894;font-size:11px;flex:0 0 auto}

/* ---------- 面板 ---------- */
.mask{position:fixed;inset:0;background:rgba(46,38,26,.34);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;left:50%;bottom:0;transform:translate(-50%,104%);
  width:min(600px,100%);max-height:92vh;background:var(--surface);
  border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
  transition:transform .32s cubic-bezier(.2,.85,.2,1);
  display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translate(-50%,0)}
@media (min-width:720px){
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.98);border-radius:22px;opacity:0;max-height:86vh}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.sheet-grip{width:38px;height:4px;border-radius:999px;background:#E5DCCB;margin:9px auto 2px;flex:0 0 auto}
@media (min-width:720px){.sheet-grip{display:none}}
.sheet-head{padding:14px 18px 10px;display:flex;align-items:flex-start;gap:10px;flex:0 0 auto}
.sheet-title{flex:1;min-width:0}
.sheet-title .line1{display:flex;align-items:center;gap:8px}
.sheet-title h3{margin:0;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-badge{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#7A6A50;
  background:#F1E6D2;border:1px solid #E4D6BC;border-radius:7px;padding:2px 7px}
.sheet-title p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;
  color:#8A7E6B;font-size:15px;flex:0 0 auto;transition:.16s}
.icon-btn:active{transform:scale(.94)}
.tabs{display:flex;gap:6px;padding:0 18px 8px;flex:0 0 auto}
.tab{padding:7px 13px;border-radius:999px;font-size:13px;color:#7A6E5C;background:#F4EEE1;
  border:1px solid #E8DDC9}
.tab.on{background:var(--sage-soft);border-color:#C6DACE;color:#3F6B5A;font-weight:600}
.sheet-body{overflow:auto;padding:4px 18px 12px;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.items{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:#FBF7EF;border:1px solid #EFE7D8}
.item .cat{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.item .body{flex:1;min-width:0}
.item .body b{font-size:14px;font-weight:600}
.item .body small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #EDE4D4;border-radius:999px;padding:2px}
.qty button{width:24px;height:24px;border-radius:50%;font-size:14px;color:#7A6E5C;display:grid;place-items:center}
.qty button:active{background:var(--bg2)}
.qty span{min-width:18px;text-align:center;font-size:12.5px;font-weight:600}
.del{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#C08A73;flex:0 0 auto}
.del:active{background:#F8E7DF}
.mini-edit{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#8A9C90;flex:0 0 auto}
.mini-edit:active{background:var(--sage-soft)}
.empty-state{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px;
  background:#FBF8F1;border:1px dashed #E5DAC5;border-radius:14px;margin-bottom:6px}
.empty-state .big{font-size:26px;display:block;margin-bottom:6px;opacity:.55}

/* 表单 */
.form{border-top:1px solid #F0E9DC;padding:14px 18px 18px;background:#FDFBF6;flex:0 0 auto}
.form-label{font-size:12px;color:#8E8271;margin:0 2px 7px;letter-spacing:.3px}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:12.5px;
  background:#F4EEE1;border:1px solid #E8DDC9;color:#6E6250;transition:.15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--sage-soft);border-color:#C6DACE;color:#3F6B5A;font-weight:600}
.chip.used{opacity:.55}
.field{flex:1;min-width:0;padding:12px 13px;border-radius:13px;font-size:14px;
  background:#fff;border:1px solid #E9E0CF;outline:none;transition:.18s}
.field:focus{border-color:#C6DACE;box-shadow:0 0 0 3px rgba(94,139,122,.10)}
.field.small{flex:0 0 88px;text-align:center}
.btn-primary{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(160deg,#6F9A88,#527E6D);
  box-shadow:0 8px 18px rgba(94,139,122,.28);transition:.16s}
.btn-primary:active{transform:scale(.985)}
.btn-primary[disabled]{opacity:.55;box-shadow:none}
.btn-ghost{width:100%;padding:13px;border-radius:14px;font-size:14px;color:#8B5A46;
  background:#FBEFE9;border:1px solid #F0D9CE}
.btn-ghost:active{transform:scale(.985)}
.form-tip{font-size:11.5px;color:#A79A87;margin:9px 2px 0;text-align:center}

/* 物品库列表 */
.lib-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:#FBF7EF;border:1px solid #EFE7D8}
.lib-row .body{flex:1;min-width:0}
.lib-row .body b{font-size:13.5px;font-weight:600}
.lib-row .body small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tag{font-size:11px;color:#8A7E6B;background:#F1E6D2;border:1px solid #E4D6BC;border-radius:6px;padding:2px 6px}
.setting-block{background:#FBF7EF;border:1px solid #EFE7D8;border-radius:14px;padding:13px;margin-bottom:12px}
.setting-block h4{margin:0 0 9px;font-size:13px;color:#6E6250;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#3E3830;color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.24s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.22);
  max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 名字弹窗 */
.mini-mask{position:fixed;inset:0;background:rgba(46,38,26,.36);z-index:80;display:none;place-items:center;padding:20px}
.mini-mask.on{display:grid}
.mini-card{background:var(--surface);border-radius:20px;padding:20px;width:min(340px,100%);box-shadow:var(--shadow-lg)}
.mini-card h4{margin:0 0 4px;font-size:16px}
.mini-card p{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.mini-card .row{display:flex;gap:8px;margin-top:12px}
.mini-card .ghost{flex:1;padding:12px;border-radius:12px;background:var(--bg2);font-size:14px;color:#6E6250}
.mini-card .ok{flex:1;padding:12px;border-radius:12px;background:var(--sage);color:#fff;font-size:14px;font-weight:600}
.foot-note{text-align:center;font-size:11.5px;color:#B3A794;margin-top:26px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.6l8.5 6.9"/><path d="M5.5 9.6V20h13V9.6"/><path d="M9.6 20v-5.4h4.8V20"/></svg>
      </div>
      <div>
        <h1>家里的柜子</h1>
        <p>被子床单，放哪儿一看就知道</p>
      </div>
    </div>
    <div class="top-spacer"></div>
    <button class="top-btn" id="libBtn">🧺 <span class="t">物品库</span></button>
    <button class="who-chip" id="whoBtn">
      <span class="who-dot"></span>
      <span class="t">我是</span> <b id="whoName">家人</b>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="overview">
    <div class="stat"><span>物品总数</span><b id="stTotal">0<i>件</i></b></div>
    <div class="stat"><span>柜子</span><b id="stCabs">0<i>个</i></b></div>
    <div class="stat"><span>物品品类</span><b id="stTypes">0<i>种</i></b></div>
  </div>

  <div class="searchbar">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>
    <input id="q" placeholder="找东西，比如「冬被」「四件套」" autocomplete="off">
    <button class="search-clear" id="qClear">✕</button>
  </div>

  <div id="rooms"></div>
  <div class="results" id="results"></div>

  <div class="activity">
    <div class="activity-head"><span class="dot"></span><h3>最近动态</h3></div>
    <div class="logs" id="logs"></div>
  </div>

  <div class="foot-note">家里几个人都可以用 · 柜子半透明，东西在里面也能看见</div>
</div>

<div class="mask" id="mask"></div>

<!-- 柜子面板 -->
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div class="sheet-title">
      <div class="line1">
        <span class="sheet-badge" id="shCode">A1</span>
        <h3 id="shTitle">柜子</h3>
      </div>
      <p id="shSub">里面 0 件物品</p>
    </div>
    <button class="icon-btn" id="shClose">✕</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabItems" onclick="switchTab('items')">柜内物品</button>
    <button class="tab" id="tabSet" onclick="switchTab('set')">柜子设置</button>
  </div>
  <div class="sheet-body" id="paneItems">
    <div class="items" id="shItems"></div>
  </div>
  <div class="sheet-body" id="paneSet" style="display:none">
    <div class="setting-block">
      <h4>柜子名称</h4>
      <div class="form-row" style="margin-bottom:0">
        <input class="field" id="cabName" placeholder="比如：换季被" maxlength="20">
        <button class="top-btn solid" onclick="saveCabName()">保存</button>
      </div>
      <div class="form-tip" style="text-align:left;margin-top:8px">给柜子起个名字，一眼知道它装什么</div>
    </div>
    <div class="setting-block">
      <h4>柜子编号</h4>
      <div class="form-row" style="margin-bottom:0">
        <input class="field" id="cabCode" placeholder="A1" maxlength="6">
        <button class="top-btn solid" onclick="saveCabCode()">保存</button>
      </div>
      <div class="form-tip" style="text-align:left;margin-top:8px">编号在整个家里不能重复</div>
    </div>
    <div class="setting-block">
      <h4>删掉这个柜子</h4>
      <button class="btn-ghost" onclick="deleteCab()">删除柜子</button>
      <div class="form-tip" style="text-align:left;margin-top:8px">柜子里的东西要先取出，才能删柜子</div>
    </div>
  </div>
  <div class="form" id="addForm">
    <div class="form-label">从物品库选一件放进这个柜子</div>
    <div class="chips" id="typeChips"></div>
    <div class="form-row">
      <input class="field" id="newTypeName" placeholder="物品库里没有？在这里新建" maxlength="40">
      <select class="field small" id="newTypeCat">
        <option>被子</option><option>床单</option><option>被套</option>
        <option>枕头</option><option>毛毯</option><option>其他</option>
      </select>
    </div>
    <div class="form-row">
      <input class="field small" id="fQty" type="number" min="1" max="999" value="1" inputmode="numeric">
      <input class="field" id="fNote" placeholder="备注（可留空）" maxlength="40">
    </div>
    <button class="btn-primary" id="fSave">放进这个柜子</button>
    <div class="form-tip">选好物品、填好数量，点一下就好</div>
  </div>
</section>

<!-- 物品库面板 -->
<section class="sheet" id="libSheet" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div class="sheet-title">
      <div class="line1"><h3>物品库</h3></div>
      <p id="libSub">家里可能有这些东西，放柜子时直接选</p>
    </div>
    <button class="icon-btn" id="libClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="items" id="libList"></div>
  </div>
  <div class="form">
    <div class="form-label">新增一种物品</div>
    <div class="form-row">
      <input class="field" id="libName" placeholder="如：冬被 / 凉席 / 毛巾被" maxlength="40">
    </div>
    <div class="chips" id="libChips"></div>
    <button class="btn-primary" id="libAdd">加到物品库</button>
    <div class="form-tip">物品库是「基础数据」：改一次名字，所有柜子里都跟着改</div>
  </div>
</section>

<div class="mini-mask" id="whoMask">
  <div class="mini-card">
    <h4>你是谁呀？</h4>
    <p>填个名字，家里人就能看到是谁放的、谁取走的</p>
    <input class="field" id="whoInput" placeholder="比如：妈妈 / 爸爸 / 小美" maxlength="10" style="width:100%">
    <div class="row">
      <button class="ghost" id="whoCancel">先不填</button>
      <button class="ok" id="whoSave">就用这个</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CAT_COLOR = {"被子":"#9DC0AD","床单":"#E3C878","被套":"#DDA077","枕头":"#A9BEDB","毛毯":"#CFA6C0","其他":"#C3B9AA"};
const CATS = ["被子","床单","被套","枕头","毛毯","其他"];

let state = null;
let who = localStorage.getItem("storage_who") || "";
let currentCab = null;
let currentTab = "items";
let selectedType = null;
let libCat = "被子";

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("on"), 1900);
}
async function api(method, path, body){
  const res = await fetch(path, {
    method,
    headers: body ? {"Content-Type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    let msg = "操作失败";
    try { msg = (await res.json()).error || msg; } catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
function needWho(){
  if(!who){ askWho(true); toast("先填个名字吧"); return true; }
  return false;
}

/* ---------- 加载与渲染 ---------- */
async function load(){
  try{
    state = await api("GET","/api/state");
    render();
  }catch(e){
    toast("连不上服务，请刷新页面");
  }
}

function render(){
  if(!state) return;
  el("whoName").textContent = who || "家人";
  let total = 0, cabs = 0;
  state.rooms.forEach(r=>{ total += r.count; cabs += r.cabinets.length; });
  el("stTotal").innerHTML = total + "<i>件</i>";
  el("stCabs").innerHTML = cabs + "<i>个</i>";
  el("stTypes").innerHTML = (state.types || []).length + "<i>种</i>";

  el("rooms").innerHTML = state.rooms.map(r=>`
    <section class="room">
      <div class="room-head">
        <h2>${esc(r.name)}</h2>
        <span class="meta">${r.cabinets.length} 个柜子 · ${r.count} 件</span>
        <span class="rule"></span>
        <button class="room-add" onclick="addCabinet(${r.id})">＋ 柜子</button>
      </div>
      <div class="cabs">${r.cabinets.map(c=>cabHTML(r,c)).join("")}</div>
    </section>`).join("");

  el("logs").innerHTML = state.logs.length ? state.logs.map(l=>`
    <div class="log-row">
      <span class="who">${esc(l.who||"家人")}</span>
      <span class="txt">${esc(l.detail)}</span>
      <span class="at">${esc(l.at||"")}</span>
    </div>`).join("") : `<div class="log-row"><span class="txt">还没有动态</span></div>`;

  if(currentCab && el("sheet").classList.contains("on")) refreshSheet();
  if(el("libSheet").classList.contains("on")) renderLib();
}

/* 半透明柜门 + 柜内物品直接可读 */
function cabHTML(room, cab){
  const items = cab.items || [];
  const shown = items.slice(0, 4);
  const inner = items.length
    ? shown.map(i=>`<div class="ins-line" style="background:${(CAT_COLOR[i.category]||"#C3B9AA")}E6">
         <b>${esc(i.name)}</b><em>×${i.qty}</em></div>`).join("")
      + (items.length > shown.length ? `<div class="ins-more">还有 ${items.length-shown.length} 种…</div>` : "")
    : `<div class="ins-empty">空柜子</div>`;
  const foot = items.length
    ? `<b>${cab.count}</b> 件 · ${items.map(i=>esc(i.name)).slice(0,4).join("、")}${items.length>4?"…":""}`
    : `<span class="empty">还没有东西，点开可以放</span>`;
  return `
    <button class="cab" onclick="openCab(${cab.id})" data-cab="${cab.id}">
      <div class="cab-head">
        <span class="cab-code">${esc(cab.code)}</span>
        ${cab.name?`<span class="cab-name">${esc(cab.name)}</span>`:""}
        ${cab.count?`<span class="cab-count ${cab.count>=6?"hot":""}">${cab.count} 件</span>`:""}
      </div>
      <div class="cab-body">
        <div class="cab-frame"><div class="cab-inside">${inner}</div></div>
        <div class="cab-door left"><i class="handle"></i></div>
        <div class="cab-door right"><i class="handle"></i></div>
      </div>
      <div class="cab-foot">${foot}</div>
    </button>`;
}

/* ---------- 柜子面板 ---------- */
function findCab(id){
  for(const r of state.rooms){
    for(const c of r.cabinets){
      if(c.id === id) return {room:r, cab:c};
    }
  }
  return null;
}
function openCab(id){
  const hit = findCab(id);
  if(!hit) return;
  currentCab = id;
  switchTab("items");
  el("cabName").value = hit.cab.name || "";
  el("cabCode").value = hit.cab.code || "";
  el("newTypeName").value = ""; el("fQty").value = 1; el("fNote").value = "";
  selectedType = null;
  refreshSheet();
  el("mask").classList.add("on");
  el("sheet").classList.add("on");
  el("sheet").setAttribute("aria-hidden","false");
}
function closeSheet(){
  el("mask").classList.remove("on");
  el("sheet").classList.remove("on");
  el("sheet").setAttribute("aria-hidden","true");
  currentCab = null;
}
function switchTab(t){
  currentTab = t;
  el("tabItems").classList.toggle("on", t==="items");
  el("tabSet").classList.toggle("on", t==="set");
  el("paneItems").style.display = t==="items" ? "" : "none";
  el("paneSet").style.display = t==="set" ? "" : "none";
  el("addForm").style.display = t==="items" ? "" : "none";
}
function refreshSheet(){
  const hit = findCab(currentCab); if(!hit) return;
  const {room, cab} = hit;
  el("shCode").textContent = cab.code;
  el("shTitle").textContent = (cab.name ? cab.name + " · " : "") + room.name;
  el("shSub").textContent = cab.items.length ? `里面 ${cab.items.length} 种 · 共 ${cab.count} 件` : "还是空的，先放点东西进去";
  el("shItems").innerHTML = cab.items.length ? cab.items.map(i=>`
    <div class="item">
      <span class="cat" style="background:${CAT_COLOR[i.category]||"#C3B9AA"}"></span>
      <div class="body">
        <b>${esc(i.name)}</b>
        <small>${esc(i.category)}${i.note?" · "+esc(i.note):""}${i.who?" · "+esc(i.who)+"放的":""}</small>
      </div>
      <div class="qty">
        <button onclick="bumpQty(${i.id},-1)">−</button>
        <span>${i.qty}</span>
        <button onclick="bumpQty(${i.id},1)">＋</button>
      </div>
      <button class="mini-edit" onclick="editItemNote(${i.id})" title="改备注">✎</button>
      <button class="del" onclick="removeItem(${i.id})" title="取出">🗑</button>
    </div>`).join("")
    : `<div class="empty-state"><span class="big">🧺</span>这个柜子还空着<br>在下面从物品库选一件放进来</div>`;
  renderTypeChips();
  if(currentTab === "set"){
    el("cabName").value = cab.name || "";
    el("cabCode").value = cab.code || "";
  }
}

function renderTypeChips(){
  const types = state.types || [];
  if(!types.length){
    el("typeChips").innerHTML = `<span class="chip" style="cursor:default">物品库还空着，先在下面新建</span>`;
    return;
  }
  const hit = findCab(currentCab);
  const inCab = new Set(hit ? hit.cab.items.map(i=>i.type_id) : []);
  el("typeChips").innerHTML = types.map(t=>`
    <button class="chip ${selectedType===t.id?"on":""} ${inCab.has(t.id)?"used":""}"
      onclick="pickType(${t.id})">${esc(t.name)}${inCab.has(t.id)?" ✓":""}</button>`).join("");
}
function pickType(id){
  selectedType = (selectedType === id) ? null : id;
  renderTypeChips();
}

el("mask").onclick = closeSheet;
el("shClose").onclick = closeSheet;

/* ---------- 放物品 ---------- */
async function addItem(){
  if(!state) return;
  if(needWho()) return;
  const qty = parseInt(el("fQty").value||"1",10);
  const note = el("fNote").value.trim();
  const newName = el("newTypeName").value.trim();
  const btn = el("fSave"); btn.disabled = true;
  try{
    if(newName){
      state = await api("POST","/api/types",{name:newName, category: el("newTypeCat").value, who});
      const t = state.types.find(x=>x.name===newName);
      state = await api("POST","/api/items",{cabinetId: currentCab, typeId: t.id, qty, note, who});
      el("newTypeName").value = "";
    }else{
      if(!selectedType){ toast("先在上面选一件物品"); btn.disabled=false; return; }
      state = await api("POST","/api/items",{cabinetId: currentCab, typeId: selectedType, qty, note, who});
    }
    selectedType = null;
    el("fQty").value = 1; el("fNote").value = "";
    render();
    toast("已放进 " + (findCab(currentCab)?.cab.code || "") + " ✓");
  }catch(e){ toast(e.message || "保存失败"); }
  finally{ btn.disabled = false; }
}
el("fSave").onclick = addItem;
el("newTypeName").addEventListener("keydown", e=>{ if(e.key==="Enter") addItem(); });

async function bumpQty(id, delta){
  const hit = findCab(currentCab); if(!hit) return;
  const item = hit.cab.items.find(i=>i.id===id); if(!item) return;
  const next = item.qty + delta;
  if(next < 1){ return removeItem(id); }
  try{
    state = await api("PATCH","/api/items/"+id,{qty:next, who});
    render();
  }catch(e){ toast(e.message || "修改失败"); }
}

async function editItemNote(id){
  const hit = findCab(currentCab); if(!hit) return;
  const item = hit.cab.items.find(i=>i.id===id); if(!item) return;
  const v = prompt(`「${item.name}」的备注：`, item.note || "");
  if(v === null) return;
  try{
    state = await api("PATCH","/api/items/"+id,{note: v.trim(), who});
    render(); toast("备注已更新");
  }catch(e){ toast(e.message || "修改失败"); }
}

async function removeItem(id){
  const hit = findCab(currentCab);
  const item = hit && hit.cab.items.find(i=>i.id===id);
  const name = item ? item.name : "这件东西";
  if(!confirm(`把「${name}」从柜子里取出吗？`)) return;
  try{
    state = await api("DELETE","/api/items/"+id+"?who="+encodeURIComponent(who||"家人"));
    render(); toast("已取出");
  }catch(e){ toast(e.message || "取出失败"); }
}

/* ---------- 柜子设置 ---------- */
async function saveCabName(){
  if(needWho()) return;
  try{
    state = await api("PATCH","/api/cabinets/"+currentCab,{name: el("cabName").value.trim(), who});
    render(); toast("柜子名已保存");
  }catch(e){ toast(e.message || "保存失败"); }
}
async function saveCabCode(){
  if(needWho()) return;
  const code = el("cabCode").value.trim();
  if(!code){ toast("编号不能为空"); return; }
  try{
    state = await api("PATCH","/api/cabinets/"+currentCab,{code, who});
    render(); toast("编号已改成 " + code.toUpperCase());
  }catch(e){ toast(e.message || "保存失败"); }
}
async function deleteCab(){
  if(needWho()) return;
  const hit = findCab(currentCab); if(!hit) return;
  if(!confirm(`确定删掉 ${hit.room.name} 的 ${hit.cab.code} 柜子吗？`)) return;
  try{
    state = await api("DELETE","/api/cabinets/"+currentCab+"?who="+encodeURIComponent(who||"家人"));
    closeSheet(); render(); toast("柜子已删除");
  }catch(e){ toast(e.message || "删除失败"); }
}
async function addCabinet(roomId){
  if(needWho()) return;
  const name = prompt("新柜子的名字（可留空）：", "");
  if(name === null) return;
  try{
    state = await api("POST","/api/cabinets",{roomId, name: name.trim(), who});
    render(); toast("已加一个柜子");
  }catch(e){ toast(e.message || "添加失败"); }
}

/* ---------- 物品库 ---------- */
function openLib(){
  renderLib();
  el("mask").classList.add("on");
  el("libSheet").classList.add("on");
  el("libSheet").setAttribute("aria-hidden","false");
}
function closeLib(){
  el("libSheet").classList.remove("on");
  el("libSheet").setAttribute("aria-hidden","true");
  el("mask").classList.remove("on");
}
function renderLib(){
  const types = (state && state.types) || [];
  el("libSub").textContent = types.length ? `共 ${types.length} 种基础物品，柜子里都从这儿选` : "还没有物品，先在下面加一个";
  el("libList").innerHTML = types.length ? types.map(t=>`
    <div class="lib-row">
      <span class="cat" style="width:9px;height:9px;border-radius:50%;background:${CAT_COLOR[t.category]||"#C3B9AA"};flex:0 0 auto"></span>
      <div class="body">
        <b>${esc(t.name)}</b>
        <small>${esc(t.category)} · ${t.used ? "在 "+t.used+" 个柜子里" : "还没放进柜子"}</small>
      </div>
      <button class="mini-edit" onclick="editType(${t.id})" title="改名/换分类">✎</button>
      <button class="del" onclick="delType(${t.id})" title="删除">🗑</button>
    </div>`).join("") : `<div class="empty-state"><span class="big">📦</span>物品库是空的</div>`;
  el("libChips").innerHTML = CATS.map(c=>
    `<button class="chip ${libCat===c?"on":""}" onclick="pickLibCat('${c}')">${c}</button>`).join("");
}
function pickLibCat(c){ libCat = c; renderLib(); }
async function addType(){
  if(needWho()) return;
  const name = el("libName").value.trim();
  if(!name){ toast("先填物品名称"); el("libName").focus(); return; }
  try{
    state = await api("POST","/api/types",{name, category: libCat, who});
    el("libName").value = ""; render(); toast("已加入物品库");
  }catch(e){ toast(e.message || "添加失败"); }
}
el("libAdd").onclick = addType;
el("libName").addEventListener("keydown", e=>{ if(e.key==="Enter") addType(); });
el("libBtn").onclick = openLib;
el("libClose").onclick = closeLib;

async function editType(id){
  const t = state.types.find(x=>x.id===id); if(!t) return;
  const name = prompt("物品名称：", t.name);
  if(name === null) return;
  const cat = prompt("分类（被子/床单/被套/枕头/毛毯/其他）：", t.category);
  if(cat === null) return;
  const c = CATS.includes(cat.trim()) ? cat.trim() : t.category;
  try{
    state = await api("PATCH","/api/types/"+id,{name: name.trim(), category: c, who});
    render(); toast("已更新");
  }catch(e){ toast(e.message || "修改失败"); }
}
async function delType(id){
  const t = state.types.find(x=>x.id===id); if(!t) return;
  if(t.used){ toast(`「${t.name}」还在 ${t.used} 个柜子里，先取出再删`); return; }
  if(!confirm(`从物品库删掉「${t.name}」？`)) return;
  try{
    state = await api("DELETE","/api/types/"+id+"?who="+encodeURIComponent(who||"家人"));
    render(); toast("已删除");
  }catch(e){ toast(e.message || "删除失败"); }
}

/* ---------- 搜索 ---------- */
let searchTimer = null;
el("q").addEventListener("input", e=>{
  const q = e.target.value.trim();
  el("qClear").classList.toggle("on", !!q);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>doSearch(q), 180);
});
el("qClear").onclick = ()=>{ el("q").value=""; el("qClear").classList.remove("on"); doSearch(""); };

async function doSearch(q){
  const box = el("results");
  if(!q){ box.classList.remove("on"); box.innerHTML=""; return; }
  let rows = [];
  try{ rows = (await api("GET","/api/search?q="+encodeURIComponent(q))).results; }catch(e){ rows=[]; }
  box.classList.add("on");
  box.innerHTML = rows.length ? rows.map(r=>`
    <button class="res-card" onclick="openCab(${r.cabinet_id})">
      <span class="res-loc">${esc(r.room_name)} ${esc(r.code)}</span>
      <div class="res-main"><b>${esc(r.name)}</b><small>${esc(r.category)}${r.note?" · "+esc(r.note):""}</small></div>
      <span class="res-qty">×${r.qty}</span>
    </button>`).join("") : `<div class="empty-state"><span class="big">🔍</span>没找到「${esc(q)}」，换个词试试</div>`;
}

/* ---------- 我是谁 ---------- */
function askWho(){
  el("whoInput").value = who || "";
  el("whoMask").classList.add("on");
  setTimeout(()=>el("whoInput").focus(), 120);
}
el("whoBtn").onclick = askWho;
el("whoCancel").onclick = ()=>el("whoMask").classList.remove("on");
el("whoSave").onclick = ()=>{
  const v = el("whoInput").value.trim().slice(0,10);
  who = v; localStorage.setItem("storage_who", v);
  el("whoMask").classList.remove("on");
  el("whoName").textContent = v || "家人";
  toast(v ? "好，用「"+v+"」这个名字" : "先用「家人」");
};
el("whoInput").addEventListener("keydown", e=>{ if(e.key==="Enter") el("whoSave").click(); });

/* ---------- 启动 ---------- */
load();
if(!who) setTimeout(()=>askWho(), 700);

/* 多人共用：每 20 秒静默同步 */
setInterval(async ()=>{
  if(document.hidden) return;
  const typing = document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName);
  if(typing) return;
  try{ state = await api("GET","/api/state"); render(); }catch(e){}
}, 20000);
</script>
</body>
</html>
